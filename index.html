<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento Contaminações - Duplo Ábaco</title>
    <!-- Bibliotecas nativas para geração de PDF vetorial sem limite de páginas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
        }

        .painel-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: stretch;
            gap: 28px;
            max-width: 1280px;
            width: 100%;
            margin: auto; /* Centraliza tanto na horizontal quanto na vertical */
        }

        .container {
            width: 100%;
            box-sizing: border-box;
            background: #fff;
            padding: 26px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        .container.abaco-1 {
            border-top: 5px solid #b32400;
        }

        .container.abaco-2 {
            border-top: 5px solid #1b369c;
        }

        h1 {
            text-align: center;
            color: #b32400;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 23px;
        }

        .container.abaco-2 h1 {
            color: #1b369c;
        }

        p.subtitle {
            text-align: center;
            color: #777;
            margin-top: 0;
            margin-bottom: 22px;
            font-size: 14px;
        }

        .barra-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background-color: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 5px solid #b32400;
            margin-bottom: 22px;
        }

        .container.abaco-2 .barra-topo {
            border-left-color: #1b369c;
        }

        .filtro-grupo {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        select {
            padding: 9px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #ccc;
            outline: none;
            background-color: #fff;
            width: 100%;
        }

        .btn-pdf {
            background-color: #b32400;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-pdf:hover {
            background-color: #8a1c00;
            transform: translateY(-2px);
        }

        .container.abaco-2 .btn-pdf {
            background-color: #1b369c;
        }

        .container.abaco-2 .btn-pdf:hover {
            background-color: #12246b;
        }

        /* 2 colunas simétricas para preencher toda a largura interna de cada ábaco */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            flex: 1;
        }

        .card {
            background-color: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
            border-top: 4px solid #b32400;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container.abaco-2 .card {
            border-top-color: #1b369c;
        }

        .card.hora {
            border-top: 4px solid #444 !important;
            grid-column: 1 / -1;
        }

        .card h3 {
            margin: 0;
            color: #555;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .card .valor {
            font-size: 38px;
            font-weight: bold;
            color: #b32400;
            margin-top: 12px;
        }

        .container.abaco-2 .card .valor {
            color: #1b369c;
        }

        .card.hora .valor {
            color: #444 !important;
            font-size: 26px;
        }

        .circular-chart {
            display: block;
            margin: 8px auto 0;
            width: 115px;
            height: 115px;
        }

        .circle-bg {
            fill: none;
            stroke: #eee;
            stroke-width: 3.8;
        }

        .circle {
            fill: none;
            stroke-width: 2.8;
            stroke-linecap: round;
            transition: stroke-dasharray 1s ease-out, stroke 0.5s ease;
        }

        .percentage {
            fill: #333;
            font-size: 8px;
            font-weight: bold;
            text-anchor: middle;
        }

        .sub-text {
            fill: #777;
            font-size: 3px;
            text-anchor: middle;
        }

        .sem-dados {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #888;
            padding: 30px;
            font-size: 15px;
        }

        footer {
            padding-top: 20px;
            padding-bottom: 5px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 1050px) {
            .painel-wrapper {
                grid-template-columns: 1fr;
                max-width: 650px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
                min-height: calc(100vh - 20px);
            }

            .container {
                padding: 18px 15px;
            }

            .barra-topo {
                flex-direction: column;
                align-items: stretch;
            }

            .filtro-grupo {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-pdf {
                width: 100%;
            }

            .grid-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="painel-wrapper">
        <!-- ==========================================
             ÁBACO 1: PRINCIPAL (OFFSET 2)
             ========================================== -->
        <div class="container abaco-1">
            <h1>Painel do Abatedouro - Ábaco 1</h1>
            <p class="subtitle">Monitoramento em Tempo Real - PCC-1B</p>

            <div class="barra-topo">
                <div class="filtro-grupo">
                    <label for="dataSelect_1" style="color: #444; font-weight: bold;">Filtro:</label>
                    <select id="dataSelect_1" onchange="renderizarTela(1)"></select>
                </div>

                <div>
                    <button class="btn-pdf" onclick="gerarPDF(1)">📄 Baixar PDF</button>
                </div>
            </div>

            <div class="grid-cards" id="containerCards_1"></div>
        </div>

        <!-- ==========================================
             ÁBACO 2: SECUNDÁRIO (OFFSET 72)
             ========================================== -->
        <div class="container abaco-2">
            <h1>Painel do Abatedouro - Ábaco 2</h1>
            <p class="subtitle">Monitoramento em Tempo Real - PCC-1B - DIF</p>

            <div class="barra-topo">
                <div class="filtro-grupo">
                    <label for="dataSelect_2" style="color: #444; font-weight: bold;">Filtro:</label>
                    <select id="dataSelect_2" onchange="renderizarTela(2)"></select>
                </div>

                <div>
                    <button class="btn-pdf" onclick="gerarPDF(2)">📄 Baixar PDF</button>
                </div>
            </div>

            <div class="grid-cards" id="containerCards_2"></div>
        </div>
    </div>

    <footer>
        Produzido por Fernando Maciel
    </footer>

    <script>
        const FIREBASE_URL_DADOS = 'https://abaco-62f10-default-rtdb.firebaseio.com/.json';

        const CONFIG_PAINEIS = {
            1: {
                tituloRelatorio: 'PCC-1B (Ábaco 1)',
                arquivoSufixo: 'PCC-1B',
                corRGB: [179, 36, 0],
                noFirebase: null,
                primeiraCarga: true
            },
            2: {
                tituloRelatorio: 'PCC-1B - DIF',
                arquivoSufixo: 'PCC-1B - DIF',
                corRGB: [27, 54, 156],
                noFirebase: 'abaco_2',
                primeiraCarga: true
            }
        };

        let dadosGlobais = {};

        async function inicializarSite() {
            await carregarDados();
            setInterval(carregarDados, 5000);
        }

        async function carregarDados() {
            try {
                const response = await fetch(`${FIREBASE_URL_DADOS}?t=${new Date().getTime()}`);
                const json = await response.json();
                if (json) {
                    dadosGlobais = json;
                    [1, 2].forEach(id => {
                        atualizarSeletorDeDatas(id);
                        renderizarTela(id);
                    });
                }
            } catch (error) {
                console.error("Erro ao carregar Firebase:", error);
            }
        }

        function obterBaseTurnos(id) {
            const no = CONFIG_PAINEIS[id].noFirebase;
            if (!no) return dadosGlobais;
            return dadosGlobais[no] || {};
        }

        function atualizarSeletorDeDatas(id) {
            const select = document.getElementById(`dataSelect_${id}`);
            const selecionado = select.value;
            const baseTurnos = obterBaseTurnos(id);
            const datas = Object.keys(baseTurnos).sort((a, b) => b.localeCompare(a));

            select.innerHTML = '';

            // Aceita estritamente chaves no padrão AAAA-MM-DD_T1 ou AAAA-MM-DD_T2 (ignora "abaco_2" e outros nós)
            const regexChaveTurno = /^\d{4}-\d{2}-\d{2}_T[12]$/;

            datas.forEach(data => {
                if (regexChaveTurno.test(data)) {
                    const option = document.createElement('option');
                    option.value = data;
                    const partes = data.split('_');
                    const [ano, mes, dia] = partes[0].split('-');
                    const nomeTurno = partes[1] === 'T1' ? 'Turno 1 (03:00 - 13:40)' : 'Turno 2 (13:40 - 03:00)';
                    option.text = `${dia}/${mes}/${ano} ${nomeTurno}`;
                    select.appendChild(option);
                }
            });

            if (CONFIG_PAINEIS[id].primeiraCarga && select.options.length > 0) {
                select.value = select.options[0].value;
                CONFIG_PAINEIS[id].primeiraCarga = false;
            } else if ([...select.options].some(o => o.value === selecionado)) {
                select.value = selecionado;
            } else if (select.options.length > 0) {
                select.value = select.options[0].value;
            }
        }

        function formatarNome(nome) {
            if (!nome) return '';
            const limpo = nome.toLowerCase().trim();
            if (limpo === 'contaminacao' || limpo === 'contaminação' || limpo === 'contaminacoes' || limpo === 'contaminações') {
                return 'Contaminação Biliar + Gastrointestinal';
            }
            return nome;
        }

        function renderizarTela(id) {
            const data = document.getElementById(`dataSelect_${id}`).value;
            const container = document.getElementById(`containerCards_${id}`);
            const baseTurnos = obterBaseTurnos(id);

            if (!data || !baseTurnos[data]) {
                container.innerHTML = `<div class="sem-dados">Aguardando registros para este ábaco...</div>`;
                return;
            }

            const dadosDoDia = baseTurnos[data];
            container.innerHTML = '';

            container.innerHTML += `
                <div class="card hora">
                    <h3>Última Atualização</h3>
                    <div class="valor">${dadosDoDia.ultima_atualizacao || '--:--:--'}</div>
                </div>
            `;

            const frangosHora = Number(dadosDoDia.Frangos_Hora ?? dadosGlobais[data]?.Frangos_Hora) || 0;
            let contHora = 0;

            const horaAtual = dadosDoDia.ultima_atualizacao
                ? dadosDoDia.ultima_atualizacao.split(':')[0].padStart(2, '0')
                : new Date().getHours().toString().padStart(2, '0');

            if (dadosDoDia.logs) {
                Object.values(dadosDoDia.logs).forEach(log => {
                    if (log.hora && log.hora.startsWith(horaAtual + ':')) {
                        contHora += Number(log.quantidade) || 1;
                    }
                });
            }

            for (const [chave, valor] of Object.entries(dadosDoDia)) {
                if (['Frangos_Hora', 'ultima_atualizacao', 'logs', 'resumo'].includes(chave)) continue;

                container.innerHTML += `
                    <div class="card">
                        <h3>${formatarNome(chave)}</h3>
                        <div class="valor">${valor}</div>
                    </div>
                `;
            }

            let pct = 0;
            if (frangosHora > 0) {
                pct = (contHora / frangosHora) * 100;
            }
            let corGrafico = pct <= 10 ? '#28a745' : '#b32400';

            container.innerHTML += `
                <div class="card">
                    <h3 style="margin-bottom: 10px;">Taxa de Contaminação (${horaAtual}h)</h3>
                    <svg viewBox="0 0 36 36" class="circular-chart">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle" stroke-dasharray="${Math.min(pct, 100).toFixed(2)}, 100" stroke="${corGrafico}" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <text x="18" y="18" class="percentage">${pct.toFixed(2).replace('.', ',')}%</text>
                        <text x="18" y="24" class="sub-text">${contHora} / ${frangosHora}</text>
                    </svg>
                </div>
            `;
        }

        function gerarPDF(id) {
            const dataEscolhida = document.getElementById(`dataSelect_${id}`).value;
            const baseTurnos = obterBaseTurnos(id);

            if (!dataEscolhida || !baseTurnos[dataEscolhida]) {
                alert("Sem dados para gerar relatório.");
                return;
            }

            const cfg = CONFIG_PAINEIS[id];
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

            const dadosDoDia = baseTurnos[dataEscolhida];
            const partes = dataEscolhida.split('_');
            const [ano, mes, dia] = partes[0].split('-');
            const nomeTurno = partes[1] === 'T1' ? 'Turno 1 (03:00 - 13:40)' : 'Turno 2 (13:40 - 03:00)';
            const turnoArquivo = partes[1] === 'T1' ? 'Turno1' : 'Turno2';
            const dataFormatada = `${dia}/${mes}/${ano} (${nomeTurno})`;
            const horaFormatada = dadosDoDia.ultima_atualizacao || '--:--';

            doc.setDrawColor(0, 0, 0);
            doc.setLineWidth(0.3);

            doc.rect(10, 10, 34, 20);
            doc.setFont("helvetica", "bolditalic");
            doc.setFontSize(14);
            doc.setTextColor(27, 54, 156);
            doc.text("Pioneiro", 27, 19, { align: "center" });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(7.5);
            doc.setTextColor(232, 108, 31);
            doc.text("Alimentos", 38, 24, { align: "right" });

            doc.rect(44, 10, 126, 20);
            doc.setTextColor(0, 0, 0);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(8.5);
            doc.text("FRANGOS PIONEIRO – INDÚSTRIA E COMÉRCIO DE ALIMENTOS LTDA.", 107, 15.5, { align: "center" });

            doc.setFont("helvetica", "normal");
            doc.setFontSize(7);
            doc.text("RODOVIA PARIGOT DE SOUZA, KM 302,8 – PR 092 – JOAQUIM TÁVORA - PR CEP: 86455-000", 107, 20.5, { align: "center" });
            doc.text("ABATEDOURO FRIGORÍFICO – SIF 1372", 107, 25.5, { align: "center" });

            doc.rect(170, 10, 30, 20);
            doc.setFontSize(7.5);
            doc.text("PAC 10", 185, 15.5, { align: "center" });
            doc.text("PAC 10.07", 185, 20.5, { align: "center" });
            doc.text("N° Versão: 41", 185, 25.5, { align: "center" });

            doc.setFillColor(217, 225, 242);
            doc.rect(10, 32, 190, 6, 'FD');
            doc.setFont("helvetica", "bold");
            doc.setFontSize(8);
            doc.text("PROGRAMA DE AUTOCONTROLE (PAC) - PROCEDIMENTOS SANITÁRIOS DAS OPERAÇÕES", 105, 36, { align: "center" });

            doc.rect(10, 38, 190, 6);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(8);
            doc.text(`MONITORAMENTO CONTAMINAÇÕES EM CARCAÇAS - ${cfg.tituloRelatorio.toUpperCase()}`, 105, 42, { align: "center" });

            doc.setFontSize(9.5);
            doc.setTextColor(50, 50, 50);
            doc.setFont("helvetica", "bold");
            doc.text("Data do Relatório: ", 10, 52);
            doc.setFont("helvetica", "normal");
            doc.text(dataFormatada, 40, 52);

            doc.setFont("helvetica", "bold");
            doc.text("Última Atualização: ", 140, 52);
            doc.setFont("helvetica", "normal");
            doc.text(horaFormatada, 173, 52);

            let cursorY = 60;

            doc.setFont("helvetica", "bold");
            doc.setFontSize(10.5);
            doc.setTextColor(68, 68, 68);
            doc.text("1. Resumo de Contaminações", 10, cursorY);

            const bodyResumo = [];
            let totalGeral = 0;

            for (const [chave, valor] of Object.entries(dadosDoDia)) {
                if (!['ultima_atualizacao', 'logs', 'resumo', 'Frangos_Hora'].includes(chave)) {
                    totalGeral += Number(valor) || 0;
                    bodyResumo.push([formatarNome(chave), String(valor)]);
                }
            }

            doc.autoTable({
                startY: cursorY + 3,
                margin: { left: 10, right: 10 },
                head: [['Tipo de Contaminação', 'Total Detectado']],
                body: bodyResumo,
                foot: [['TOTAL GERAL:', String(totalGeral)]],
                theme: 'grid',
                headStyles: { fillColor: cfg.corRGB, textColor: 255, fontStyle: 'bold', halign: 'left' },
                footStyles: { fillColor: [234, 234, 234], textColor: cfg.corRGB, fontStyle: 'bold' },
                columnStyles: {
                    0: { cellWidth: 135, halign: 'left' },
                    1: { cellWidth: 55, halign: 'center' }
                },
                didParseCell: function (data) {
                    if (data.section === 'head' && data.column.index === 1) {
                        data.cell.styles.halign = 'center';
                    }
                    if (data.section === 'foot' && data.column.index === 0) {
                        data.cell.styles.halign = 'right';
                        data.cell.styles.textColor = [0, 0, 0];
                    }
                    if (data.section === 'foot' && data.column.index === 1) {
                        data.cell.styles.halign = 'center';
                    }
                }
            });

            cursorY = doc.lastAutoTable.finalY + 10;

            const bodyHora = [];
            const bodyLogs = [];

            if (dadosDoDia.logs) {
                const arrayLogs = Object.values(dadosDoDia.logs).sort((a, b) => a.hora.localeCompare(b.hora));
                let resumoPorHora = {};

                arrayLogs.forEach(log => {
                    bodyLogs.push([
                        log.hora,
                        formatarNome(log.doenca),
                        String(log.frangos_hora || 0)
                    ]);

                    let horaBase = log.hora.split(':')[0];
                    let qtd = Number(log.quantidade) || 1;
                    let vel = Number(log.frangos_hora || 0);

                    if (!resumoPorHora[horaBase]) {
                        resumoPorHora[horaBase] = { contaminacoes: 0, somaVelocidade: 0, contagemEventos: 0 };
                    }

                    resumoPorHora[horaBase].contaminacoes += qtd;
                    if (vel > 0) {
                        resumoPorHora[horaBase].somaVelocidade += vel;
                        resumoPorHora[horaBase].contagemEventos += 1;
                    }
                });

                for (let horaStr of Object.keys(resumoPorHora).sort()) {
                    let dadosHora = resumoPorHora[horaStr];
                    let horaAtualNum = parseInt(horaStr, 10);
                    let horaSeguinte = ((horaAtualNum + 1) % 24).toString().padStart(2, '0');
                    let faixaHorario = `Das ${horaStr}:00 às ${horaSeguinte}:00`;

                    let mediaFrangos = dadosHora.contagemEventos > 0
                        ? Math.round(dadosHora.somaVelocidade / dadosHora.contagemEventos)
                        : 0;

                    let taxaNum = mediaFrangos > 0 ? (dadosHora.contaminacoes / mediaFrangos) * 100 : 0;
                    let porcentagem = taxaNum.toFixed(2).replace('.', ',') + '%';

                    bodyHora.push([
                        faixaHorario,
                        String(dadosHora.contaminacoes),
                        String(mediaFrangos),
                        porcentagem
                    ]);
                }
            }

            if (bodyLogs.length === 0) {
                bodyHora.push([{ content: 'Sem dados para gerar média por hora.', colSpan: 4, styles: { halign: 'center', textColor: 120 } }]);
                bodyLogs.push([{ content: 'Nenhuma ocorrência registrada neste turno.', colSpan: 3, styles: { halign: 'center', textColor: 120 } }]);
            }

            doc.setFont("helvetica", "bold");
            doc.setFontSize(10.5);
            doc.setTextColor(68, 68, 68);
            doc.text("2. Agrupamento por Hora", 10, cursorY);

            doc.autoTable({
                startY: cursorY + 3,
                margin: { left: 10, right: 10 },
                head: [['Faixa de Horário', 'Total Contaminado', 'Média Frangos/Hora', 'Taxa (%)']],
                body: bodyHora,
                theme: 'grid',
                headStyles: { fillColor: [68, 68, 68], textColor: 255, fontStyle: 'bold', halign: 'center' },
                columnStyles: {
                    0: { cellWidth: 55, halign: 'center' },
                    1: { cellWidth: 45, halign: 'center' },
                    2: { cellWidth: 50, halign: 'center' },
                    3: { cellWidth: 40, halign: 'center', fontStyle: 'bold' }
                },
                didParseCell: function (data) {
                    if (data.section === 'body' && data.column.index === 3 && data.cell.raw && data.cell.raw.includes('%')) {
                        const val = parseFloat(data.cell.raw.replace('%', '').replace(',', '.'));
                        data.cell.styles.textColor = val > 10 ? [179, 36, 0] : [40, 167, 69];
                    }
                }
            });

            cursorY = doc.lastAutoTable.finalY + 10;

            if (cursorY > 270) {
                doc.addPage();
                cursorY = 15;
            }

            doc.setFont("helvetica", "bold");
            doc.setFontSize(10.5);
            doc.setTextColor(68, 68, 68);
            doc.text("3. Histórico Detalhado (Log de Eventos)", 10, cursorY);

            doc.autoTable({
                startY: cursorY + 3,
                margin: { left: 10, right: 10, bottom: 15 },
                head: [['Hora', 'Contaminação Registrada', 'Frangos por Hora']],
                body: bodyLogs,
                theme: 'grid',
                headStyles: { fillColor: [68, 68, 68], textColor: 255, fontStyle: 'bold' },
                styles: { fontSize: 8.5, cellPadding: 2 },
                columnStyles: {
                    0: { cellWidth: 35, halign: 'center' },
                    1: { cellWidth: 110, halign: 'left' },
                    2: { cellWidth: 45, halign: 'center' }
                },
                didParseCell: function (data) {
                    if (data.section === 'head' && (data.column.index === 0 || data.column.index === 2)) {
                        data.cell.styles.halign = 'center';
                    }
                }
            });

            const totalPaginas = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPaginas; i++) {
                doc.setPage(i);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(8);
                doc.setTextColor(136, 136, 136);
                doc.text("Documento gerado automaticamente pelo Sistema Supervisório.", 10, 290);
                doc.text(`Página ${i} de ${totalPaginas}`, 200, 290, { align: "right" });
            }

            doc.save(`Relatorio_Abatedouro_${cfg.arquivoSufixo}_${dia}-${mes}-${ano}_${turnoArquivo}.pdf`);
        }

        window.onload = inicializarSite;
    </script>
</body>
