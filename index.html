<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento contaminações</title>
    <!-- Bibliotecas nativas para geração de PDF vetorial sem limite de páginas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
        }

        .container {
            max-width: 900px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #b32400;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #777;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .barra-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background-color: #f9f9f9;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 5px solid #b32400;
            margin-bottom: 30px;
        }

        .filtro-grupo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            outline: none;
            background-color: #fff;
        }

        .btn-pdf {
            background-color: #b32400;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-pdf:hover {
            background-color: #8a1c00;
            transform: translateY(-2px);
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
            border-top: 4px solid #b32400;
        }

        .card.hora {
            border-top: 4px solid #444;
            grid-column: 1 / -1;
        }

        .card h3 {
            margin: 0;
            color: #555;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card .valor {
            font-size: 40px;
            font-weight: bold;
            color: #b32400;
            margin-top: 15px;
        }

        .card.hora .valor {
            color: #444;
            font-size: 28px;
        }

        .circular-chart {
            display: block;
            margin: 10px auto;
            width: 120px;
            height: 120px;
        }

        .circle-bg {
            fill: none;
            stroke: #eee;
            stroke-width: 3.8;
        }

        .circle {
            fill: none;
            stroke-width: 2.8;
            stroke-linecap: round;
            transition: stroke-dasharray 1s ease-out, stroke 0.5s ease;
        }

        .percentage {
            fill: #333;
            font-size: 8px;
            font-weight: bold;
            text-anchor: middle;
        }

        .sub-text {
            fill: #777;
            font-size: 3px;
            text-anchor: middle;
        }

        footer {
            margin-top: auto;
            padding-top: 25px;
            padding-bottom: 5px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        /* ==========================================
           RESPONSIVIDADE PARA CELULARES
           ========================================== */
        @media (max-width: 600px) {
            body {
                padding: 10px;
                min-height: calc(100vh - 20px);
            }

            .container {
                padding: 18px 15px;
                border-radius: 10px;
            }

            h1 {
                font-size: 22px;
            }

            p.subtitle {
                font-size: 14px;
                margin-bottom: 20px;
            }

            .barra-topo {
                flex-direction: column;
                align-items: stretch;
                padding: 14px;
                gap: 12px;
                margin-bottom: 20px;
            }

            .filtro-grupo {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }

            select {
                width: 100%;
                font-size: 15px;
                padding: 10px 8px;
            }

            .btn-pdf {
                width: 100%;
                padding: 12px;
                font-size: 15px;
            }

            .grid-cards {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .card {
                padding: 18px 15px;
            }

            .card h3 {
                font-size: 14px;
            }

            .card .valor {
                font-size: 34px;
                margin-top: 10px;
            }

            .card.hora .valor {
                font-size: 24px;
            }

            .circular-chart {
                width: 110px;
                height: 110px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Painel do Abatedouro</h1>
        <p class="subtitle">Monitoramento em Tempo Real - PCC-1B</p>

        <div class="barra-topo">
            <div class="filtro-grupo">
                <label for="dataSelect" style="color: #444; font-weight: bold;">Filtro:</label>
                <select id="dataSelect" onchange="renderizarTela()"></select>
            </div>

            <div>
                <button class="btn-pdf" onclick="gerarPDF()">📄 Baixar PDF</button>
            </div>
        </div>

        <div class="grid-cards" id="containerCards"></div>
    </div>

    <footer>
        Produzido por Fernando Maciel
    </footer>

    <script>
        const FIREBASE_URL_DADOS = 'https://abaco-62f10-default-rtdb.firebaseio.com/.json';

        let dadosGlobais = {};
        let primeiraCarga = true;

        async function inicializarSite() {
            carregarDados();
            setInterval(carregarDados, 5000);
        }

        async function carregarDados() {
            try {
                const response = await fetch(`${FIREBASE_URL_DADOS}?t=${new Date().getTime()}`);
                dadosGlobais = await response.json();
                if (dadosGlobais) {
                    atualizarSeletorDeDatas();
                    renderizarTela();
                }
            } catch (error) { console.error(error); }
        }

        function atualizarSeletorDeDatas() {
            const select = document.getElementById('dataSelect');
            const selecionado = select.value;
            const datas = Object.keys(dadosGlobais).sort((a, b) => b.localeCompare(a));
            select.innerHTML = '';

            datas.forEach(data => {
                if (data.includes('_')) {
                    const option = document.createElement('option');
                    option.value = data;
                    const partes = data.split('_');
                    const [ano, mes, dia] = partes[0].split('-');
                    const nomeTurno = partes[1] === 'T1' ? 'Turno 1 (03:00 - 13:40)' : 'Turno 2 (13:40 - 03:00)';
                    option.text = `${dia}/${mes}/${ano} ${nomeTurno}`;
                    select.appendChild(option);
                }
            });

            if (primeiraCarga && select.options.length > 0) {
                select.value = select.options[0].value;
                primeiraCarga = false;
            } else if ([...select.options].some(o => o.value === selecionado)) {
                select.value = selecionado;
            } else if (select.options.length > 0) {
                select.value = select.options[0].value;
            }
        }

        function formatarNome(nome) {
            if (!nome) return '';
            const limpo = nome.toLowerCase().trim();
            if (limpo === 'contaminacao' || limpo === 'contaminação' || limpo === 'contaminacoes' || limpo === 'contaminações') {
                return 'Contaminação Biliar + Gastrointestinal';
            }
            return nome;
        }

        function renderizarTela() {
            const data = document.getElementById('dataSelect').value;
            if (!data) return;
            const dadosDoDia = dadosGlobais[data];
            const container = document.getElementById('containerCards');
            container.innerHTML = '';

            if (dadosDoDia) {
                container.innerHTML += `
                    <div class="card hora">
                        <h3>Última Atualização</h3>
                        <div class="valor">${dadosDoDia.ultima_atualizacao || '--:--:--'}</div>
                    </div>
                `;

                let frangosHora = Number(dadosDoDia.Frangos_Hora) || 0;
                let contHora = 0;

                const horaAtual = dadosDoDia.ultima_atualizacao
                    ? dadosDoDia.ultima_atualizacao.split(':')[0].padStart(2, '0')
                    : new Date().getHours().toString().padStart(2, '0');

                if (dadosDoDia.logs) {
                    Object.values(dadosDoDia.logs).forEach(log => {
                        if (log.hora && log.hora.startsWith(horaAtual + ':')) {
                            contHora += Number(log.quantidade) || 1;
                        }
                    });
                }

                for (const [chave, valor] of Object.entries(dadosDoDia)) {
                    if (chave === 'Frangos_Hora') continue;

                    if (chave !== 'ultima_atualizacao' && chave !== 'logs' && chave !== 'resumo') {
                        container.innerHTML += `
                            <div class="card">
                                <h3>${formatarNome(chave)}</h3>
                                <div class="valor">${valor}</div>
                            </div>
                        `;
                    }
                }

                let pct = 0;
                if (frangosHora > 0) { pct = (contHora / frangosHora) * 100; }
                let corGrafico = pct <= 10 ? '#28a745' : '#b32400';

                container.innerHTML += `
                    <div class="card" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                        <h3 style="margin-bottom: 15px;">Taxa de Contaminação (${horaAtual}h)</h3>
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="circle" stroke-dasharray="${pct.toFixed(2)}, 100" stroke="${corGrafico}" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text x="18" y="18" class="percentage">${pct.toFixed(2).replace('.', ',')}%</text>
                            <text x="18" y="24" class="sub-text">${contHora} / ${frangosHora}</text>
                        </svg>
                    </div>
                `;
            }
        }

        function gerarPDF() {
            const dataEscolhida = document.getElementById('dataSelect').value;
            if (!dataEscolhida || !dadosGlobais[dataEscolhida]) {
                alert("Sem dados para gerar relatório.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

            const dadosDoDia = dadosGlobais[dataEscolhida];
            const partes = dataEscolhida.split('_');
            const [ano, mes, dia] = partes[0].split('-');
            const nomeTurno = partes[1] === 'T1' ? 'Turno 1 (03:00 - 13:40)' : 'Turno 2 (13:40 - 03:00)';
            const turnoArquivo = partes[1] === 'T1' ? 'Turno1' : 'Turno2';
            const dataFormatada = `${dia}/${mes}/${ano} (${nomeTurno})`;
            const horaFormatada = dadosDoDia.ultima_atualizacao || '--:--';

            // ==========================================
            // 1. CABEÇALHO INSTITUCIONAL (PADRÃO PAC)
            // ==========================================
            doc.setDrawColor(0, 0, 0);
            doc.setLineWidth(0.3);

            // Caixa Esquerda - Logo Pioneiro Alimentos
            doc.rect(10, 10, 34, 20);
            doc.setFont("helvetica", "bolditalic");
            doc.setFontSize(14);
            doc.setTextColor(27, 54, 156); // Azul Pioneiro
            doc.text("Pioneiro", 27, 19, { align: "center" });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(7.5);
            doc.setTextColor(232, 108, 31); // Laranja Alimentos
            doc.text("Alimentos", 38, 24, { align: "right" });

            // Caixa Central - Dados da Empresa
            doc.rect(44, 10, 126, 20);
            doc.setTextColor(0, 0, 0);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(8.5);
            doc.text("FRANGOS PIONEIRO – INDÚSTRIA E COMÉRCIO DE ALIMENTOS LTDA.", 107, 15.5, { align: "center" });

            doc.setFont("helvetica", "normal");
            doc.setFontSize(7);
            doc.text("RODOVIA PARIGOT DE SOUZA, KM 302,8 – PR 092 – JOAQUIM TÁVORA - PR CEP: 86455-000", 107, 20.5, { align: "center" });
            doc.text("ABATEDOURO FRIGORÍFICO – SIF 1372", 107, 25.5, { align: "center" });

            // Caixa Direita - Código PAC
            doc.rect(170, 10, 30, 20);
            doc.setFontSize(7.5);
            doc.text("PAC 10", 185, 15.5, { align: "center" });
            doc.text("PAC 10.07", 185, 20.5, { align: "center" });
            doc.text("N° Versão: 41", 185, 25.5, { align: "center" });

            // Faixa Azul Claro - Título do Programa
            doc.setFillColor(217, 225, 242);
            doc.rect(10, 32, 190, 6, 'FD');
            doc.setFont("helvetica", "bold");
            doc.setFontSize(8);
            doc.text("PROGRAMA DE AUTOCONTROLE (PAC) - PROCEDIMENTOS SANITÁRIOS DAS OPERAÇÕES", 105, 36, { align: "center" });

            // Faixa Branca - Subtítulo
            doc.rect(10, 38, 190, 6);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(8);
            doc.text("MONITORAMENTO CONTAMINAÇÕES EM CARCAÇAS", 105, 42, { align: "center" });

            // Metadados (Data e Última Atualização)
            doc.setFontSize(9.5);
            doc.setTextColor(50, 50, 50);
            doc.setFont("helvetica", "bold");
            doc.text("Data do Relatório: ", 10, 52);
            doc.setFont("helvetica", "normal");
            doc.text(dataFormatada, 40, 52);

            doc.setFont("helvetica", "bold");
            doc.text("Última Atualização: ", 140, 52);
            doc.setFont("helvetica", "normal");
            doc.text(horaFormatada, 173, 52);

            let cursorY = 60;

            // ==========================================
            // 2. TABELA 1: RESUMO DE CONTAMINAÇÕES
            // ==========================================
            doc.setFont("helvetica", "bold");
            doc.setFontSize(10.5);
            doc.setTextColor(68, 68, 68);
            doc.text("1. Resumo de Contaminações", 10, cursorY);

            const bodyResumo = [];
            let totalGeral = 0;

            for (const [chave, valor] of Object.entries(dadosDoDia)) {
                if (chave !== 'ultima_atualizacao' && chave !== 'logs' && chave !== 'resumo' && chave !== 'Frangos_Hora') {
                    totalGeral += Number(valor) || 0;
                    bodyResumo.push([formatarNome(chave), String(valor)]);
                }
            }

            doc.autoTable({
                startY: cursorY + 3,
                margin: { left: 10, right: 10 },
                head: [['Tipo de Contaminação', 'Total Detectado']],
                body: bodyResumo,
                foot: [['TOTAL GERAL:', String(totalGeral)]],
                theme: 'grid',
                headStyles: { fillColor: [179, 36, 0], textColor: 255, fontStyle: 'bold', halign: 'left' },
                footStyles: { fillColor: [234, 234, 234], textColor: [179, 36, 0], fontStyle: 'bold' },
                columnStyles: {
                    0: { cellWidth: 135, halign: 'left' },
                    1: { cellWidth: 55, halign: 'center' }
                },
                didParseCell: function (data) {
                    if (data.section === 'head' && data.column.index === 1) {
                        data.cell.styles.halign = 'center';
                    }
                    if (data.section === 'foot' && data.column.index === 0) {
                        data.cell.styles.halign = 'right';
                        data.cell.styles.textColor = [0, 0, 0];
                    }
                    if (data.section === 'foot' && data.column.index === 1) {
                        data.cell.styles.halign = 'center';
                    }
                }
            });

            cursorY = doc.lastAutoTable.finalY + 10;

            // ==========================================
            // 3. PREPARAÇÃO DOS DADOS DE LOG E HORA
            // ==========================================
            const bodyHora = [];
            const bodyLogs = [];

            if (dadosDoDia.logs) {
                const arrayLogs = Object.values(dadosDoDia.logs).sort((a, b) => a.hora.localeCompare(b.hora));
                let resumoPorHora = {};

                arrayLogs.forEach(log => {
                    bodyLogs.push([
                        log.hora,
                        formatarNome(log.doenca),
                        String(log.frangos_hora || 0)
                    ]);

                    let horaBase = log.hora.split(':')[0];
                    let qtd = Number(log.quantidade) || 1;
                    let vel = Number(log.frangos_hora || 0);

                    if (!resumoPorHora[horaBase]) {
                        resumoPorHora[horaBase] = { contaminacoes: 0, somaVelocidade: 0, contagemEventos: 0 };
                    }

                    resumoPorHora[horaBase].contaminacoes += qtd;
                    if (vel > 0) {
                        resumoPorHora[horaBase].somaVelocidade += vel;
                        resumoPorHora[horaBase].contagemEventos += 1;
                    }
                });

                for (let horaStr of Object.keys(resumoPorHora).sort()) {
                    let dadosHora = resumoPorHora[horaStr];
                    let horaAtualNum = parseInt(horaStr, 10);
                    let horaSeguinte = ((horaAtualNum + 1) % 24).toString().padStart(2, '0');
                    let faixaHorario = `Das ${horaStr}:00 às ${horaSeguinte}:00`;

                    let mediaFrangos = dadosHora.contagemEventos > 0
                        ? Math.round(dadosHora.somaVelocidade / dadosHora.contagemEventos)
                        : 0;

                    let taxaNum = mediaFrangos > 0 ? (dadosHora.contaminacoes / mediaFrangos) * 100 : 0;
                    let porcentagem = taxaNum.toFixed(2).replace('.', ',') + '%';

                    bodyHora.push([
                        faixaHorario,
                        String(dadosHora.contaminacoes),
                        String(mediaFrangos),
                        porcentagem
                    ]);
                }
            }

            if (bodyLogs.length === 0) {
                bodyHora.push([{ content: 'Sem dados para gerar média por hora.', colSpan: 4, styles: { halign: 'center', textColor: 120 } }]);
                bodyLogs.push([{ content: 'Nenhuma ocorrência registrada neste turno.', colSpan: 3, styles: { halign: 'center', textColor: 120 } }]);
            }

            // ==========================================
            // 4. TABELA 2: AGRUPAMENTO POR HORA
            // ==========================================
            doc.setFont("helvetica", "bold");
            doc.setFontSize(10.5);
            doc.setTextColor(68, 68, 68);
            doc.text("2. Agrupamento por Hora", 10, cursorY);

            doc.autoTable({
                startY: cursorY + 3,
                margin: { left: 10, right: 10 },
                head: [['Faixa de Horário', 'Total Contaminado', 'Média Frangos/Hora', 'Taxa (%)']],
                body: bodyHora,
                theme: 'grid',
                headStyles: { fillColor: [68, 68, 68], textColor: 255, fontStyle: 'bold', halign: 'center' },
                columnStyles: {
                    0: { cellWidth: 55, halign: 'center' },
                    1: { cellWidth: 45, halign: 'center' },
                    2: { cellWidth: 50, halign: 'center' },
                    3: { cellWidth: 40, halign: 'center', fontStyle: 'bold' }
                },
                didParseCell: function (data) {
                    if (data.section === 'body' && data.column.index === 3 && data.cell.raw && data.cell.raw.includes('%')) {
                        const val = parseFloat(data.cell.raw.replace('%', '').replace(',', '.'));
                        data.cell.styles.textColor = val > 10 ? [179, 36, 0] : [40, 167, 69];
                    }
                }
            });

            cursorY = doc.lastAutoTable.finalY + 10;

            // ==========================================
            // 5. TABELA 3: HISTÓRICO DETALHADO (LOG)
            // ==========================================
            if (cursorY > 270) {
                doc.addPage();
                cursorY = 15;
            }

            doc.setFont("helvetica", "bold");
            doc.setFontSize(10.5);
            doc.setTextColor(68, 68, 68);
            doc.text("3. Histórico Detalhado (Log de Eventos)", 10, cursorY);

            doc.autoTable({
                startY: cursorY + 3,
                margin: { left: 10, right: 10, bottom: 15 },
                head: [['Hora', 'Contaminação Registrada', 'Frangos por Hora']],
                body: bodyLogs,
                theme: 'grid',
                headStyles: { fillColor: [68, 68, 68], textColor: 255, fontStyle: 'bold' },
                styles: { fontSize: 8.5, cellPadding: 2 },
                columnStyles: {
                    0: { cellWidth: 35, halign: 'center' },
                    1: { cellWidth: 110, halign: 'left' },
                    2: { cellWidth: 45, halign: 'center' }
                },
                didParseCell: function (data) {
                    if (data.section === 'head' && (data.column.index === 0 || data.column.index === 2)) {
                        data.cell.styles.halign = 'center';
                    }
                }
            });

            // ==========================================
            // 6. RODAPÉ E PAGINAÇÃO EM TODAS AS PÁGINAS
            // ==========================================
            const totalPaginas = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPaginas; i++) {
                doc.setPage(i);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(8);
                doc.setTextColor(136, 136, 136);
                doc.text("Documento gerado automaticamente pelo Sistema Supervisório.", 10, 290);
                doc.text(`Página ${i} de ${totalPaginas}`, 200, 290, { align: "right" });
            }

            doc.save(`Relatorio_Abatedouro_PCC-1B_${dia}-${mes}-${ano}_${turnoArquivo}.pdf`);
        }

        window.onload = inicializarSite;
    </script>
</body>

</html>
